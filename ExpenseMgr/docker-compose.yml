version: '3.8'

services:
  web:
    build: .
    command: poetry run uvicorn expensemgr.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/expensemgr
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ExpenseMgr
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
